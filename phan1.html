<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 1 - Form Đơn Giản</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #2563eb;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"] {
            background-color: #2563eb;
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        button[type="reset"] {
            background-color: #e5e7eb;
            color: #374151;
        }

        button[type="reset"]:hover {
            background-color: #d1d5db;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>NHẬP THÔNG TIN</h2>
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" name="hobby" value="thethao"> Thể thao</label>
                    <label class="checkbox-item"><input type="checkbox" name="hobby" value="amnhac"> Âm nhạc</label>
                    <label class="checkbox-item"><input type="checkbox" name="hobby" value="dienthoai"> Đọc sách</label>
                    <label class="checkbox-item"><input type="checkbox" name="hobby" value="dulich"> Du lịch</label>
                </div>
            </div>

            <div class="button-group">
                <button type="submit">Gửi thông tin</button>
                <button type="reset">Nhập lại</button>
            </div>

        </form>
    </div>

</body>
</html>
