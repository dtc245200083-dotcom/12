<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 2 - Form Đăng Ký Học Viên</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 30px 15px;
            margin: 0;
        }

        .form-card {
            background-color: #ffffff;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-card h2 {
            text-align: center;
            color: #0d6efd;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label.title-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #212529;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 15px;
            color: #495057;
            background-color: #fff;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            border-color: #86b7fe;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .inline-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .inline-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-weight: normal;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .btn-submit {
            background-color: #0d6efd;
            color: white;
        }

        .btn-submit:hover {
            background-color: #0b5ed7;
        }

        .btn-reset {
            background-color: #6c757d;
            color: white;
        }

        .btn-reset:hover {
            background-color: #5c636a;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>ĐĂNG KÝ HỌC VIÊN</h2>
        <form action="#" method="POST">

            <!-- Họ và tên -->
            <div class="form-group">
                <label class="title-label" for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập đầy đủ họ và tên" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="title-label" for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <!-- Số điện thoại -->
            <div class="form-group">
                <label class="title-label" for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
            </div>

            <!-- Ngày sinh -->
            <div class="form-group">
                <label class="title-label" for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <!-- Giới tính -->
            <div class="form-group">
                <label class="title-label">Giới tính:</label>
                <div class="inline-group">
                    <label class="inline-item"><input type="radio" name="gender" value="male" checked> Nam</label>
                    <label class="inline-item"><input type="radio" name="gender" value="female"> Nữ</label>
                    <label class="inline-item"><input type="radio" name="gender" value="other"> Khác</label>
                </div>
            </div>

            <!-- Địa chỉ -->
            <div class="form-group">
                <label class="title-label" for="address">Địa chỉ:</label>
                <textarea id="address" name="address" placeholder="Nhập địa chỉ của bạn..."></textarea>
            </div>

            <!-- Khóa học -->
            <div class="form-group">
                <label class="title-label" for="course">Khóa học:</label>
                <select id="course" name="course">
                    <option value="html_css">HTML & CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <!-- Hình thức học -->
            <div class="form-group">
                <label class="title-label">Hình thức học:</label>
                <div class="inline-group">
                    <label class="inline-item"><input type="radio" name="study_type" value="online" checked> Online</label>
                    <label class="inline-item"><input type="radio" name="study_type" value="offline"> Offline</label>
                </div>
            </div>

            <!-- Sở thích -->
            <div class="form-group">
                <label class="title-label">Sở thích:</label>
                <div class="inline-group">
                    <label class="inline-item"><input type="checkbox" name="hobby" value="coding"> Lập trình</label>
                    <label class="inline-item"><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                    <label class="inline-item"><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>
                    <label class="inline-item"><input type="checkbox" name="hobby" value="gaming"> Chơi game</label>
                </div>
            </div>

            <!-- Ghi chú -->
            <div class="form-group">
                <label class="title-label" for="note">Ghi chú:</label>
                <textarea id="note" name="note" placeholder="Nhập yêu cầu thêm (nếu có)..."></textarea>
            </div>

            <!-- Nút bấm -->
            <div class="btn-group">
                <button type="submit" class="btn btn-submit">Đăng ký</button>
                <button type="reset" class="btn btn-reset">Nhập lại</button>
            </div>

        </form>
    </div>

</body>
</html>
